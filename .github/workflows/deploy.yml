name: Deploy Instabiz

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/frappe-bench/apps/instabiz
            git pull origin develop
            cd ~/frappe-bench
            bench --site frontend migrate --skip-failing
            bench restart
            echo "Dev deploy done."

  deploy-prod:
    name: Deploy to Production Container
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - name: SSH into WSL and rebuild Docker
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WSL_HOST }}
          username: ${{ secrets.WSL_USER }}
          key: ${{ secrets.WSL_SSH_KEY }}
          script: |
            cd ~/prod-container

            # Get latest commit hash from develop branch
            COMMIT=$(git ls-remote https://github.com/viktorvaughn-ai/instabiz develop | cut -f1)

            # Update commit in apps.json
            python3 -c "
            import json
            with open('apps.json', 'r') as f:
                apps = json.load(f)
            for app in apps:
                if 'instabiz' in app['url']:
                    app['commit'] = '${COMMIT}'
            with open('apps.json', 'w') as f:
                json.dump(apps, f, indent=2)
            print('Updated instabiz commit to ${COMMIT}')
            "

            # Rebuild image
            sudo docker build \
              --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
              --build-arg=FRAPPE_BRANCH=version-15 \
              --build-arg=PYTHON_VERSION=3.11.6 \
              --build-arg=NODE_VERSION=18.18.2 \
              --build-arg=APPS_JSON_BASE64=$(base64 -w 0 apps.json) \
              --tag=instabiz-prod:latest \
              --file=images/custom/Containerfile .

            # Restart containers with new image
            sudo docker compose down
            sudo docker compose up -d

            # Wait for backend to be ready
            sleep 15

            # Run migrations and clear cache
            sudo docker compose exec -T backend bench --site frontend migrate
            sudo docker compose exec -T backend bench --site frontend clear-cache

            echo "Prod deploy done."
